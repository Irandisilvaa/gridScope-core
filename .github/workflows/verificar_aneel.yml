name: Consulta ANEEL (somente referência)

on:
  schedule:
    # Roda no dia 1 e 15 de cada mês às 08:00
    - cron: '0 8 1,15 * *'
  workflow_dispatch: # Permite rodar manualmente clicando num botão

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Instalar dependências da consulta
        run: python -m pip install requests python-dotenv
        
      - name: Consultar referência ANEEL sem publicar dados
        run: python src/etl/monitor_aneel.py
