services:
  gridscope:
    build: .
    container_name: gridscope_system
    ports:
      - "8000:8000"
    volumes:
      - ./dados:/app/dados
      - ./logs:/app/logs
      - ./.env:/app/.env
      - .:/app
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/gridscope_local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_SOURCE=${DATA_SOURCE:-local_file}
      - FILE_GDB=${FILE_GDB:-Energisa_SE_6587_2024-12-31_V11_20250902-1412.gdb}
      - DISTRIBUTOR_SOURCE_URL=${DISTRIBUTOR_SOURCE_URL:-}
      - DISTRIBUTOR_API_TOKEN=${DISTRIBUTOR_API_TOKEN:-}
      - DATA_SOURCE_TIMEOUT_SECONDS=${DATA_SOURCE_TIMEOUT_SECONDS:-120}
      - DATA_MAX_DOWNLOAD_BYTES=${DATA_MAX_DOWNLOAD_BYTES:-2147483648}
      - DATA_MAX_ARCHIVE_ENTRIES=${DATA_MAX_ARCHIVE_ENTRIES:-100000}
      - DATA_INGEST_ON_STARTUP=${DATA_INGEST_ON_STARTUP:-false}
      - TRAIN_MODEL_ON_STARTUP=${TRAIN_MODEL_ON_STARTUP:-false}

  frontend:
    build: ./frontend
    container_name: gridscope_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - gridscope

  db:
    image: postgis/postgis:15-3.3
    container_name: gridscope_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: gridscope_local
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: gridscope_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
