services:
  gridscope:
    build: .
    container_name: gridscope_system
    ports:
      - "8000:8000"
    volumes:
      - ./dados:/app/dados
      - ./logs:/app/logs
      - ./.env:/app/.env
      - .:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER:?Defina DATABASE_URL_DOCKER no arquivo .env}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATA_SOURCE: "${DATA_SOURCE:-local_file}"
      FILE_GDB: "${FILE_GDB:-Energisa_SE_6587_2024-12-31_V11_20250902-1412.gdb}"
      DISTRIBUTOR_SOURCE_URL: "${DISTRIBUTOR_SOURCE_URL:-}"
      DISTRIBUTOR_API_TOKEN: "${DISTRIBUTOR_API_TOKEN:-}"
      DATA_SOURCE_TIMEOUT_SECONDS: "${DATA_SOURCE_TIMEOUT_SECONDS:-120}"
      DATA_MAX_DOWNLOAD_BYTES: "${DATA_MAX_DOWNLOAD_BYTES:-2147483648}"
      DATA_MAX_ARCHIVE_ENTRIES: "${DATA_MAX_ARCHIVE_ENTRIES:-100000}"
      DATA_INGEST_ON_STARTUP: "${DATA_INGEST_ON_STARTUP:-false}"
      TRAIN_MODEL_ON_STARTUP: "${TRAIN_MODEL_ON_STARTUP:-false}"

  frontend:
    build: ./frontend
    container_name: gridscope_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      gridscope:
        condition: service_healthy

  db:
    image: postgis/postgis:15-3.3
    container_name: gridscope_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      POSTGRES_DB: "${POSTGRES_DB:-gridscope_local}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: gridscope_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pg_data:
  redis_data:
