services:
  gridscope:
    build: .
    container_name: gridscope_system
    ports:
      - "8000:8000"
    user: "${GRID_SCOPE_UID:-1000}:${GRID_SCOPE_GID:-1000}"
    volumes:
      - ./dados:/app/dados
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER:?Defina DATABASE_URL_DOCKER no arquivo .env}"
      DATABASE_SCHEMA: "${DATABASE_SCHEMA:-public}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "${REDIS_DB:-0}"
      AUTH_SESSION_TTL_SECONDS: "${AUTH_SESSION_TTL_SECONDS:-28800}"
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-gridscope_session}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_LOGIN_RATE_LIMIT: "${AUTH_LOGIN_RATE_LIMIT:-8}"
      AUTH_LOGIN_RATE_WINDOW_SECONDS: "${AUTH_LOGIN_RATE_WINDOW_SECONDS:-900}"
      AUTH_CHAT_RATE_LIMIT: "${AUTH_CHAT_RATE_LIMIT:-20}"
      AUTH_CHAT_RATE_WINDOW_SECONDS: "${AUTH_CHAT_RATE_WINDOW_SECONDS:-60}"
      AUTH_ADMIN_RATE_LIMIT: "${AUTH_ADMIN_RATE_LIMIT:-30}"
      AUTH_ADMIN_RATE_WINDOW_SECONDS: "${AUTH_ADMIN_RATE_WINDOW_SECONDS:-60}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CHAT_MODEL: "${CHAT_MODEL:-gemini-3-flash-preview}"
      CIDADE_ALVO: "${CIDADE_ALVO:-Aracaju, Sergipe, Brazil}"
      DISTRIBUIDORA_ALVO: "${DISTRIBUIDORA_ALVO:-Energisa SE}"
      ANEEL_API_HUB_URL: "${ANEEL_API_HUB_URL:-https://hub.arcgis.com/api/search/v1/collections/all/items}"
      DATA_SOURCE: "${DATA_SOURCE:-local_file}"
      FILE_GDB: "${FILE_GDB:-Energisa_SE_6587_2024-12-31_V11_20250902-1412.gdb}"
      DISTRIBUTOR_SOURCE_URL: "${DISTRIBUTOR_SOURCE_URL:-}"
      DISTRIBUTOR_API_TOKEN: "${DISTRIBUTOR_API_TOKEN:-}"
      DATA_SOURCE_TIMEOUT_SECONDS: "${DATA_SOURCE_TIMEOUT_SECONDS:-120}"
      DATA_MAX_DOWNLOAD_BYTES: "${DATA_MAX_DOWNLOAD_BYTES:-2147483648}"
      DATA_MAX_ARCHIVE_ENTRIES: "${DATA_MAX_ARCHIVE_ENTRIES:-100000}"
      DATA_INGEST_ON_STARTUP: "${DATA_INGEST_ON_STARTUP:-false}"
      TRAIN_MODEL_ON_STARTUP: "${TRAIN_MODEL_ON_STARTUP:-false}"
      ALLOW_FILE_CACHE: "${ALLOW_FILE_CACHE:-true}"

  frontend:
    build: ./frontend
    container_name: gridscope_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      gridscope:
        condition: service_healthy

  db:
    image: postgis/postgis:15-3.3
    container_name: gridscope_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      POSTGRES_DB: "${POSTGRES_DB:-gridscope_local}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: gridscope_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pg_data:
  redis_data:
